# Builds a version, or proves one could be built (docs/releases.md, Cutting a release).
#
# One run builds every platform in ci/platforms.json from the commit it runs on, stages each
# archive on a clean machine the way a node stages a release, and only when every platform passed
# leaves a DRAFT GitHub release v<version> holding every archive, each platform's digestif-update
# and the manifest to sign. A platform that fails leaves no release and no manifest.
#
# - A pushed v<MAJOR.MINOR.PATCH> tag on a commit of main: a version. The tag is the version
#   (ci/version.sh); pushing it is the whole dispatch. `ci/release.sh build` pushes the next one and
#   waits for this run.
# - Every push to main, every pull request, and by hand: the same builds and checks as a dry run of
#   whatever version the commit is (0.0.0 between tags), uploading nothing.
#   A fleet merge build's pull request (batch-*) is the one pull request it skips, and so is a push
#   to main touching only release/, the channel `ci/release.sh publish` and a signer's take-backs
#   write (docs/releases.md, The channel).
# - Dispatched on main with a `candidate` version, by `ci/release.sh candidate` once both signers
#   signed and the combined manifest.sig.json is on the prerelease: no build, only the test nodes
#   for that version (docs/releases.md, Test nodes). A push to the channel branch starts nothing,
#   since GitHub reads a push's workflow from the pushed commit and that branch holds none.

name: Release
run-name: ${{ inputs.candidate != '' && format('Test nodes {0}', inputs.candidate) || '' }}

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A tag push is never filtered by path.
    paths-ignore: ["release/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      candidate:
        description: A prerelease both signers signed, for the test nodes
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ inputs.candidate || 'build' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A fleet merge build's pull request (head branch batch-*) is skipped: its land merges it seconds
  # after it opens, so its run builds a tree main's own push builds next, and only the failure
  # mail of a run nobody waits on reaches anyone (ISS-42597).
  plan:
    if: ${{ !startsWith(github.head_ref, 'batch-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      candidate: ${{ steps.plan.outputs.candidate }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          CANDIDATE: ${{ inputs.candidate }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(ci/version.sh)"
          publish=false
          if [ -n "$CANDIDATE" ] &&
            ! [[ "$CANDIDATE" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::candidate $CANDIDATE is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$REF_TYPE" = tag ]; then
            if [ "v$version" != "$TAG" ]; then
              echo "::error::tag $TAG is not v<MAJOR.MINOR.PATCH> on $GITHUB_SHA (ci/version.sh read $version)"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::$TAG names $GITHUB_SHA, which is not on main; a version is a tag of main"
              exit 1
            fi
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
              echo "::error::release $TAG is published; a published version is never rebuilt"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "candidate=$CANDIDATE"
            echo "platforms=$(jq -c .platforms ci/platforms.json)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version from $GITHUB_SHA; publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.candidate == ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    name: build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # The plan's version, and never the build's own reading of the tag: a tag pushed onto this
    # commit after the plan ran (a version cut from main seconds after the push) would otherwise
    # turn a 0.0.0 dry run into a build of that version halfway through, staging dist/<tag>/ where
    # every later step reads dist/0.0.0/ (ISS-47771). ci/release-artifact.sh and
    # ci/release-linux.sh take DIGESTIF_VERSION set as the version.
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      DIGESTIF_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # What's new (docs/releases.md): the version's ledger, the message of its tag when
      # `ci/release.sh build --changelog` wrote one, else what `ci/release.sh changelog` left on the
      # channel branch, and every version's commit titles otherwise.
      - name: the changelog
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          ledger=()
          if [ "$REF_TYPE" = tag ] &&
            git fetch --quiet --force origin "refs/tags/$TAG:refs/tags/$TAG" &&
            [ "$(git cat-file -t "refs/tags/$TAG")" = tag ] &&
            git tag -l --format='%(contents)' "$TAG" > dist/ledger.json &&
            jq -e 'type == "array"' dist/ledger.json >/dev/null 2>&1; then
            ledger=(dist/ledger.json)
          elif git fetch --quiet origin refs/heads/channel 2>/dev/null &&
            git show "FETCH_HEAD:changelog/$GITHUB_SHA.json" > dist/ledger.json 2>/dev/null; then
            ledger=(dist/ledger.json)
          fi
          ci/changelog.sh "$VERSION" "${ledger[@]}" > dist/changelog.json
          echo "changelog.json: $(jq '.versions | length' dist/changelog.json) versions, ledger: ${ledger[*]:-none}"
      - if: startsWith(matrix.platform, 'darwin-')
        uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3.9.1
        with:
          ocaml-compiler: 5.2
      - if: startsWith(matrix.platform, 'darwin-')
        run: |
          opam install ./node --deps-only --yes
          opam exec -- ci/release-artifact.sh
      - if: startsWith(matrix.platform, 'linux-')
        run: ci/release-linux.sh
      - name: the archive is this platform's
        run: |
          mkdir -p out
          cp "dist/$VERSION/digestif-${{ matrix.platform }}.tar.gz" out/
          cp "dist/$VERSION/digestif-update-${{ matrix.platform }}" out/digestif-update
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # A fresh machine that never built anything: the archive and the digestif-update built beside it,
  # and on Linux a container of another distribution holding no Node.js, since the archive carries
  # its own.
  check:
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    name: check ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.platform }}
          path: release
      - run: ci/release-check.sh "${{ needs.plan.outputs.version }}" release

  # The draft release v<version>: every archive, every platform's digestif-update as
  # digestif-update-<platform>, install.sh (the hosted install script), and manifest.json, whose notes are the commit titles since the last
  # published version (or the tag's own message, when a person wrote one). A draft is readable only
  # by people with write access until it is published. Run again on the same tag, it replaces the
  # draft's files and drops every signature beside them, since a signature is over the manifest's
  # exact bytes. Every file it leaves is attested first (docs/releases.md, What ties a version to
  # its build), so `sign --next` signs only files this workflow built on the tag's commit.
  publish:
    needs: [plan, check]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: v${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
      # A tag's message is the notes when a person wrote it; a ledger `ci/release.sh build
      # --changelog` wrote there is What's new, not notes. Otherwise the commit titles since the
      # newest version the release list names (main's release/, the channel branch's while main's
      # names none), since no release is marked Latest.
      - name: the notes
        run: |
          # checkout can leave a pushed annotated tag as a lightweight one; read the remote's.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          message=""
          if [ "$(git cat-file -t "refs/tags/$TAG")" = tag ]; then
            message="$(git tag -l --format='%(contents)' "$TAG")"
          fi
          if [ -n "$message" ] && ! jq -e 'type == "array"' <<<"$message" >/dev/null 2>&1; then
            printf '%s\n' "$message" > notes.txt
          else
            newest='[ .releases[].version ] | sort_by(split(".") | map(tonumber)) | last // empty'
            last="$(git show origin/main:release/index.json 2>/dev/null | jq -r "$newest" || true)"
            if [ -z "$last" ] && git fetch --quiet origin refs/heads/channel 2>/dev/null; then
              last="$(git show FETCH_HEAD:index.json | jq -r "$newest" || true)"
            fi
            range="$GITHUB_SHA"
            [ -z "$last" ] || range="v$last..$GITHUB_SHA"
            git log --no-merges --format='- %s' "$range" > notes.txt
          fi
          cat notes.txt
      - name: write the manifest naming every platform
        run: |
          tool=release/release-linux-x86_64/digestif-update
          chmod 755 "$tool"
          mkdir -p assets
          args=()
          for p in $(jq -r '.platforms[].platform' ci/platforms.json); do
            cp "release/release-$p/digestif-$p.tar.gz" assets/
            cp "release/release-$p/digestif-update" "assets/digestif-update-$p"
            args+=(--artifact "$p=assets/digestif-$p.tar.gz")
          done
          "$tool" manifest "$VERSION" --notes="$(cat notes.txt)" --platforms ci/platforms.json \
            --url-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            "${args[@]}" > assets/manifest.json
          cat assets/manifest.json
      # The hosted install script for the release's own install.sh asset, carrying each platform's
      # sha256 from the manifest above, and linking the version's release page, which shows
      # manifest.json beside every signature: the same bytes the relay renders at
      # https://digestif.io/install.sh once the version is published and both signers signed it
      # (relay/src/install.ts).
      - name: write the hosted install script
        run: |
          bash ci/install-hosted.sh assets/manifest.json \
            "https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" > assets/install.sh
          sh -n assets/install.sh
      # Every archive, every digestif-update, install.sh and manifest.json, attested as built by
      # this workflow on the tag at this commit, before any of them reaches the draft.
      - name: attest every file of the draft
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: leave the draft release ${{ env.TAG }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$a" in *.sig.json) gh release delete-asset "$TAG" "$a" --yes ;; esac
            done
            gh release upload "$TAG" assets/* --clobber
            gh release edit "$TAG" --notes-file notes.txt
          else
            gh release create "$TAG" assets/* --draft --verify-tag \
              --title "Digestif $VERSION" --notes-file notes.txt
          fi
          echo "Draft release $TAG: $(ls assets | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

  # One throwaway node per platform takes the candidate as a member's node would (ci/test-node.sh,
  # docs/releases.md, Test nodes). A run that ends with the refused step failed says the version is
  # bad, and any other way a job ends says nothing about it: `ci/release.sh test-nodes` reads that
  # difference, and dispatching again is how a silent job is restarted.
  test-node:
    needs: plan
    if: needs.plan.outputs.candidate != ''
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.platforms) }}
    name: test node ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: node
        name: the node takes ${{ needs.plan.outputs.candidate }}
        run: |
          status=0
          ci/test-node.sh "${{ needs.plan.outputs.candidate }}" || status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: the version failed on this node
        if: steps.node.outputs.status == '1'
        run: exit 1
      - name: this node observed nothing
        if: steps.node.outputs.status != '0' && steps.node.outputs.status != '1'
        run: exit 1
